services:
  rails:
    image: ghcr.io/n8nmonk-wq/chatwoot_size_optimized:latest
    container_name: chatwoot_rails
    restart: unless-stopped
    env_file: .env
    volumes:
      - chatwoot_storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    networks:
      - chatwoot_internal
      - n8n_default
    deploy:
      resources:
        limits:
          memory: 900M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatwoot.rule=Host(`chatwoot.srv1275499.hstgr.cloud`)"
      - "traefik.http.routers.chatwoot.entrypoints=websecure"
      - "traefik.http.routers.chatwoot.tls.certresolver=mytlschallenge"
      - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"
      - "traefik.docker.network=n8n_default"

  sidekiq:
    image: ghcr.io/n8nmonk-wq/chatwoot_size_optimized:latest
    container_name: chatwoot_sidekiq
    restart: unless-stopped
    env_file: .env
    volumes:
      - chatwoot_storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    networks:
      - chatwoot_internal
    deploy:
      resources:
        limits:
          memory: 600M

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatwoot_postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c max_connections=50 -c work_mem=4MB -c effective_cache_size=256MB
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - chatwoot_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300M

  redis:
    image: redis:alpine
    container_name: chatwoot_redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    env_file: .env
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - chatwoot_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 150M

volumes:
  chatwoot_storage_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:

networks:
  chatwoot_internal:
    driver: bridge
  n8n_default:
    external: true
